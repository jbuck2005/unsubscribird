version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: edge
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /app
    target-branch: edge
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    target-branch: edge
    schedule:
      interval: monthly
