name: Release

# Publishes the images for the version in app/wbs/__init__.py and addon/config.yaml:
#   ghcr.io/<owner>/amd64-unsubscribird and aarch64-unsubscribird   (the add-on pulls these)
#   ghcr.io/<owner>/unsubscribird                                    (both, for docker compose)
# Releases are made by hand, when you choose: push a tag like v0.29.0 (it must match the version in both files).
# Merging to main does NOT publish on its own, so main can hold a finished, unreleased version until you tag it.
#
# Two guard rails:
#   * One release a day. A tag pushed on a day that already has a release publishes nothing (release_guard.py).
#     The day is counted in the repository variable RELEASE_TZ (an IANA name, default UTC).
#   * The GitHub Release is only drafted, with the changelog section as its notes. Publishing it is left to you.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every tag, for the one-a-day check
      - id: v
        name: Which version, and does it match the tag?
        run: |
          app=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/wbs/__init__.py)
          addon=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          echo "tag $GITHUB_REF_NAME, app $app, add-on $addon"
          [ "$app" = "$addon" ]
          [ "${GITHUB_REF_NAME#v}" = "$app" ]
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: One release a day
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TZ: ${{ vars.RELEASE_TZ || 'UTC' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 .github/scripts/release_guard.py --tag "$GITHUB_REF_NAME" --tz "$RELEASE_TZ" \
            --releases "$RUNNER_TEMP/releases.json"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-unsubscribird:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-unsubscribird:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One image for both architectures
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          r=ghcr.io/${OWNER,,}
          for tag in "$VERSION" latest; do
            docker buildx imagetools create -t "$r/unsubscribird:$tag" \
              "$r/amd64-unsubscribird:$VERSION" "$r/aarch64-unsubscribird:$VERSION"
          done

  draft:
    # Only after every image is up. Drafts the GitHub Release with this version's changelog section as its notes,
    # and never publishes it: review it and press Publish yourself. A re-run leaves an existing release alone.
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "A release for v$VERSION already exists: left as it is"
            exit 0
          fi
          awk -v h="## $VERSION" '$0 == h {on=1; next} on && /^## / {exit} on' addon/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See addon/CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          printf '\n---\nImages: `ghcr.io/%s/unsubscribird:%s` (amd64 and arm64).\n' "${GITHUB_REPOSITORY_OWNER,,}" "$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --draft --verify-tag --title "un-subscribird $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
