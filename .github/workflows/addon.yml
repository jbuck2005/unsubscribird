name: Add-on

on:
  push:
    branches: [main]
    paths: [addon/**, repository.yaml, .github/workflows/addon.yml]
  pull_request:
    paths: [addon/**, repository.yaml, .github/workflows/addon.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks config.yaml against what the Supervisor accepts
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./addon
