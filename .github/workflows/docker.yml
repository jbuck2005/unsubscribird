name: Docker build

on:
  push:
    branches: [main, edge]
    paths: [app/**, tests/smoke_models.py, .github/workflows/docker.yml]
  pull_request:
    paths: [app/**, tests/smoke_models.py, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]   # the add-on's amd64 and aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Builds the image (including torch and the ML requirements) without publishing it.
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: false
          load: true
          tags: unsubscribird:ci
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - name: The app imports inside the image
        run: docker run --rm -e UNSUB_AUTH=off unsubscribird:ci python -c "import open_clip, torch, wbs.config, wbs.start"
      # The real OWL-ViT and BioCLIP 2 calls on a blank frame (downloads both models), so a library upgrade that
      # changes their APIs fails here instead of on a running station.
      - name: The models run inside the image
        run: docker run --rm -e UNSUB_AUTH=off -v "$PWD/tests/smoke_models.py:/app/smoke_models.py:ro" unsubscribird:ci python smoke_models.py
