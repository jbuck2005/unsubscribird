name: Docker build

on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/docker.yml]
  pull_request:
    paths: [app/**, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds the image (including torch and the ML requirements) without publishing it.
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: unsubscribird:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The app imports inside the image
        run: docker run --rm -e WBS_AUTH=off unsubscribird:ci python -c "import open_clip, torch, wbs.config"
